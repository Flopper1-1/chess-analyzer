name: Build Mobile Release (APK & IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android APK via Capacitor
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ChessAnalyzer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessAnalyzer-Android-APK
          path: mobile/ChessAnalyzer.apk

      - name: Attach ChessAnalyzer.apk to Release v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.2.0 mobile/ChessAnalyzer.apk --clobber

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build iOS IPA via Capacitor & Xcode
        working-directory: mobile
        run: |
          npm install
          npx cap add ios
          npx cap sync ios
          cd ios/App
          if [ -f Podfile ]; then
            pod install
          fi
          if [ -d App.xcworkspace ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../ChessAnalyzer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessAnalyzer-iOS-IPA
          path: mobile/ChessAnalyzer.ipa

      - name: Attach ChessAnalyzer.ipa to Release v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.2.0 mobile/ChessAnalyzer.ipa --clobber
